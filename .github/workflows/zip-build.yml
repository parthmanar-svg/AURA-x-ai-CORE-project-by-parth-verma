name: Build APK from zip
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        run: unzip -q core.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Use modern Gradle files for CI only
        working-directory: COREAndroid-AIDE
        run: |
          cp tools/ci/settings.gradle settings.gradle
          cp tools/ci/build.gradle build.gradle
          cp tools/ci/app-build.gradle app/build.gradle
          sed -i 's/ package="com.core.ai"//' app/src/main/AndroidManifest.xml
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Create Gradle wrapper
        working-directory: COREAndroid-AIDE
        run: gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        working-directory: COREAndroid-AIDE
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CORE-debug-apk
          path: COREAndroid-AIDE/app/build/outputs/apk/debug/app-debug.apk
          
