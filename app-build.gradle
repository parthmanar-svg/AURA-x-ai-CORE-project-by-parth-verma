plugins { id 'com.android.application' }
android {
    namespace 'com.core.ai'
    compileSdk 34
    defaultConfig {
        applicationId "com.core.ai"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    androidResources { noCompress 'tflite', 'wasm', 'js', 'html' }
    // libsd.so is run as a program, so native libs must be extracted to disk
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
