# Copy to .github/workflows/build-sd.yml, then Actions > "Build image engine" > Run workflow.
# Builds stable-diffusion.cpp's CLI for Android arm64 and names it libsd.so (CORE runs it as a program).
# Download the artifact and put libsd.so in app/src/main/jniLibs/arm64-v8a/.
# Written without being able to run it here; if a step fails, the log shows which one.
name: Build image engine
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get stable-diffusion.cpp
        run: git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp
      - name: Build for Android arm64
        run: |
          cd stable-diffusion.cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++"
          cmake --build build --config Release -j"$(nproc)"
      - name: Collect libsd.so
        run: |
          BIN=$(find stable-diffusion.cpp/build -type f \( -name sd-cli -o -name sd \) | head -1)
          echo "Using $BIN"; file "$BIN" || true
          mkdir out && cp "$BIN" out/libsd.so
      - uses: actions/upload-artifact@v4
        with: { name: libsd, path: out/libsd.so }
