# Copy to .github/workflows/build-apk.yml. Actions > "Build APK" > Run workflow.
# Builds a debug APK (installable as-is) and also produces a Gradle wrapper (gradlew) you can download.
# Your AIDE files are NOT changed: the workflow swaps in modern Gradle files (tools/ci) only on the runner.
# Put libcore_llm.so (and libsd.so) in app/src/main/jniLibs/arm64-v8a/ in the repo first.
# Written without being able to run it here; if a step fails, the log shows which one.
name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Use modern Gradle files for CI only
        run: |
          cp tools/ci/settings.gradle settings.gradle
          cp tools/ci/build.gradle build.gradle
          cp tools/ci/app-build.gradle app/build.gradle
          sed -i 's/ package="com.core.ai"//' app/src/main/AndroidManifest.xml
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: CORE-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
